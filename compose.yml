name: blogology

services:
  postgres:
    image: postgres:17
    container_name: blogology-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5433:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

    volumes:
      - blogology_data:/var/lib/postgresql/data

    networks:
      - blogology_network

  redis:
    image: redis:7-alpine
    container_name: blogology-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

    volumes:
      - blogology_redis_data:/data

    networks:
      - blogology_network

volumes:
  blogology_data:
    name: blogology-data
  blogology_redis_data:
    name: blogology-redis-data

networks:
  blogology_network:
    name: blogology-network
